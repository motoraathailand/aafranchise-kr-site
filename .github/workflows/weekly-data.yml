name: Weekly brand data refresh

# Uses the two approved KFTC public-data APIs (politely: robots.txt, 1.6 s delay, identifying User-Agent), checks the result and,
# if the checks pass, commits to main (GitHub Pages serves docs/): new docs/data/brands.json + meta.json (new version) when the data changed,
# otherwise only a heartbeat (meta.json 'checkedAt'; version unchanged so apps do not re-download). The weekly commit also keeps the repo active,
# so GitHub does not disable the schedule after 60 days of inactivity. If a check fails the job fails and nothing is committed.
# Takes about one minute (one bounded public catalog). Run it by hand from Actions > "Weekly brand data refresh" > Run workflow (tick "force" to publish even if nothing changed).
on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC (10:00 Thailand)
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the content did not change (bumps meta.version)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: brand-data
  cancel-in-progress: false

jobs:
  refresh:
    outputs:
      checked: ${{ steps.refresh.outputs.checkedAt }}
      count: ${{ steps.refresh.outputs.count }}
      want: ${{ steps.refresh.outputs.version }}
      heartbeat: ${{ steps.refresh.outputs.heartbeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required credential is configured
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: test -n "$DATA_GO_KR_SERVICE_KEY"
      - name: Scrape, check, build
        id: refresh
        env:
          FORCE: ${{ inputs.force }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATA_GO_KR_REQUIRED: '1'
        run: node tools/weekly-refresh.mjs
      - name: Test publication
        run: node tools/check-publication.mjs
      - name: Commit and push
        if: steps.refresh.outputs.heartbeat == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "${{ steps.refresh.outputs.message }}"
          git pull --rebase -q origin main
          git push origin HEAD:main
  # Pages and live verification form one serialized job after the collection commit.
  deploy:
    needs: refresh
    if: always() && needs.refresh.outputs.heartbeat == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      want: ${{ needs.refresh.outputs.want }}
      count: ${{ needs.refresh.outputs.count }}
      checked: ${{ needs.refresh.outputs.checked }}
    secrets: inherit
